name: Create release

on:
  workflow_dispatch:
    inputs:
      increment:
        description: Semantic version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  actions: read
  contents: write
  packages: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
      source_sha: ${{ steps.version.outputs.source_sha }}
      image_exists: ${{ steps.image_status.outputs.image_exists }}
      already_released: ${{ steps.completion.outputs.already_released }}
    steps:
      - name: Require the main branch
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ "$RELEASE_REF" != "refs/heads/main" ]]; then
            echo "Releases must be started from the main branch; got $RELEASE_REF" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch main and release tags
        run: git fetch origin main --tags --force
      - name: Test release scripts
        run: node --test .github/scripts/*.test.mjs
      - id: version
        name: Calculate release version
        env:
          INCREMENT: ${{ inputs.increment }}
        run: node .github/scripts/calculate-release-version.mjs "$INCREMENT" "$GITHUB_SHA" origin/main
      - id: release_status
        name: Check for a completed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" == "false" ]]; then
              echo "release_exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "release_exists=false" >> "$GITHUB_OUTPUT"
              echo "Release $TAG exists as a draft and will be completed."
            fi
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: image_status
        name: Check for a release image
        env:
          IMAGE: ghcr.io/ministryofjustice/${{ github.event.repository.name }}:${{ steps.version.outputs.version }}
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            node .github/scripts/verify-release-image.mjs "$IMAGE" "$SOURCE_SHA"
            echo "image_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "image_exists=false" >> "$GITHUB_OUTPUT"
          fi
      - id: completion
        name: Check whether the release is complete
        env:
          RELEASE_EXISTS: ${{ steps.release_status.outputs.release_exists }}
          IMAGE_EXISTS: ${{ steps.image_status.outputs.image_exists }}
        run: |
          if [[ "$RELEASE_EXISTS" == "true" && "$IMAGE_EXISTS" == "true" ]]; then
            echo "already_released=true" >> "$GITHUB_OUTPUT"
            echo "Release is already complete; no tag, image or release will be recreated."
          else
            echo "already_released=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Require a successful main pipeline
        if: steps.completion.outputs.already_released != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
        run: |
          successful_runs=$(gh run list \
            --workflow pipeline.yml \
            --branch main \
            --commit "$SOURCE_SHA" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq 'length')
          if [[ "$successful_runs" != "1" ]]; then
            echo "Commit $SOURCE_SHA has not completed the main pipeline and development deployment" >&2
            exit 1
          fi
      - name: Summarise release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
        run: |
          echo "### Release candidate" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source commit: \`$SOURCE_SHA\`" >> "$GITHUB_STEP_SUMMARY"

  node_build:
    name: Node build
    if: needs.prepare.outputs.already_released != 'true'
    needs: prepare
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/node_build.yml@v2
    secrets: inherit

  node_unit_tests:
    name: Node unit tests
    if: needs.prepare.outputs.already_released != 'true'
    needs:
      - prepare
      - node_build
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/node_unit_tests.yml@v2
    secrets: inherit

  node_integration_tests:
    name: Node integration tests
    if: needs.prepare.outputs.already_released != 'true'
    needs:
      - prepare
      - node_build
    uses: ./.github/workflows/node_integration_tests.yml
    secrets: inherit

  helm_lint:
    name: Helm lint (${{ matrix.environment }})
    if: needs.prepare.outputs.already_released != 'true'
    needs: prepare
    strategy:
      matrix:
        environment: [dev, preprod, prod]
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/test_helm_lint.yml@v2
    secrets: inherit
    with:
      environment: ${{ matrix.environment }}

  create_tag:
    name: Create immutable release tag
    if: needs.prepare.outputs.already_released != 'true'
    needs:
      - prepare
      - node_unit_tests
      - node_integration_tests
      - helm_lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create or verify tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          git fetch origin --tags --force

          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            tagged_sha=$(git rev-list -n 1 "$TAG")
            if [[ "$tagged_sha" != "$SOURCE_SHA" ]]; then
              echo "Tag $TAG already points to $tagged_sha, not $SOURCE_SHA" >&2
              exit 1
            fi
            echo "Tag $TAG already points to the expected commit; continuing the release."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$TAG" "$SOURCE_SHA" --message "Release $TAG"
          git push origin "refs/tags/$TAG"

  build_release_image:
    name: Build immutable release image
    if: needs.prepare.outputs.already_released != 'true' && needs.prepare.outputs.image_exists != 'true'
    needs:
      - prepare
      - create_tag
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/docker_build.yml@v2
    with:
      docker_registry: ghcr.io
      registry_org: ministryofjustice
      image_version: ${{ needs.prepare.outputs.version }}
      push: true
      tag_latest: false
      docker_multiplatform: true

  publish_release:
    name: Publish GitHub release
    if: >-
      always() &&
      needs.prepare.outputs.already_released != 'true' &&
      needs.create_tag.result == 'success' &&
      (needs.build_release_image.result == 'success' || needs.build_release_image.result == 'skipped')
    needs:
      - prepare
      - create_tag
      - build_release_image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify release image
        env:
          IMAGE: ghcr.io/ministryofjustice/${{ github.event.repository.name }}:${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: node .github/scripts/verify-release-image.mjs "$IMAGE" "$SOURCE_SHA"
      - name: Create or publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" == "true" ]]; then
              gh release edit "$TAG" --draft=false --verify-tag
            else
              echo "Release $TAG is already published."
            fi
            exit 0
          fi

          arguments=("$TAG" --verify-tag --generate-notes --target "$SOURCE_SHA" --title "$TAG")
          if [[ -n "$PREVIOUS_TAG" ]]; then
            arguments+=(--notes-start-tag "$PREVIOUS_TAG")
          fi
          gh release create "${arguments[@]}"
